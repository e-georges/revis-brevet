ode : calculer la réduction (25%=÷4) puis soustraire.","annale":"Liste officielle MEN oct. 2025 — Appliquer une diminution en %"},{"id":"auto_09","niveau":2,"type_brevet":"automatisme","theme_auto":"Appliquer une augmentation en %","enonce":"Un salaire de 1200 € augmente de 10%. Nouveau salaire ?","options":["A) 1210 €","B) 1320 €","C) 1300 €","D) 1120 €"],"bonne_reponse":1,"explication":"10% de 1200 = 120. Nouveau salaire = 1200 + 120 = 1320 €. Méthode rapide : × 1,10.","annale":"Liste officielle MEN oct. 2025 — Appliquer une augmentation en %"},{"id":"auto_10","niveau":2,"type_brevet":"automatisme","theme_auto":"Notation scientifique","enonce":"Écrire 0,0045 en notation scientifique.","options":["A) 45 × 10⁻⁴","B) 4,5 × 10⁻³","C) 0,45 × 10⁻²","D) 4,5 × 10³"],"bonne_reponse":1,"explication":"On déplace la virgule de 3 rangs vers la droite → 4,5 × 10⁻³. Règle : 1 ≤ a < 10.","annale":"Liste officielle MEN oct. 2025 — Notation scientifique"},{"id":"auto_11","niveau":2,"type_brevet":"automatisme","theme_auto":"Notation scientifique","enonce":"Écrire 3,2 × 10⁴ en écriture décimale.","options":["A) 320","B) 3200","C) 32 000","D) 320 000"],"bonne_reponse":2,"explication":"10⁴ = 10 000. 3,2 × 10 000 = 32 000. La virgule se déplace de 4 rangs vers la droite.","annale":"Liste officielle MEN oct. 2025 — Notation scientifique"},{"id":"auto_12","niveau":1,"type_brevet":"automatisme","theme_auto":"Carrés de 1 à 12","enonce":"Combien vaut 9² ?","options":["A) 18","B) 81","C) 72","D) 90"],"bonne_reponse":1,"explication":"9² = 9 × 9 = 81. Carrés à mémoriser : 1,4,9,16,25,36,49,64,81,100,121,144.","annale":"Liste officielle MEN oct. 2025 — Carrés des entiers de 1 à 12"},{"id":"auto_13","niveau":1,"type_brevet":"automatisme","theme_auto":"Carrés de 1 à 12","enonce":"Quelle est la valeur de 11² ?","options":["A) 111","B) 121","C) 101","D) 22"],"bonne_reponse":1,"explication":"11² = 121. Astuce : (10+1)² = 100 + 20 + 1 = 121.","annale":"Liste officielle MEN oct. 2025 — Carrés des entiers de 1 à 12"},{"id":"auto_14","niveau":1,"type_brevet":"automatisme","theme_auto":"Critères de divisibilité","enonce":"2 358 est-il divisible par 9 ?","options":["A) Non","B) Oui, car il est pair","C) Oui, car la somme des chiffres (2+3+5+8=18) est divisible par 9","D) Oui, car il finit par 8"],"bonne_reponse":2,"explication":"Critère par 9 : somme des chiffres divisible par 9. 2+3+5+8=18 et 18÷9=2. Autres critères : par 2→unités paires ; par 3→somme divisible par 3 ; par 5→finit par 0 ou 5.","annale":"Liste officielle MEN oct. 2025 — Critères divisibilité 2,3,5,9"},{"id":"auto_15","niveau":2,"type_brevet":"automatisme","theme_auto":"Expressions littérales","enonce":"Simplifier : 3a + 2b − a + 5b","options":["A) 3a + 7b","B) 2a + 7b","C) 4a + 3b","D) 2a − 3b"],"bonne_reponse":1,"explication":"Regrouper les termes : (3a−a) + (2b+5b) = 2a + 7b. On n'additionne que les termes de même nature.","annale":"Liste officielle MEN oct. 2025 — Simplifier expressions littérales"},{"id":"auto_16","niveau":2,"type_brevet":"automatisme","theme_auto":"Équation ax = c","enonce":"Résoudre : 5x = 35","options":["A) x = 30","B) x = 40","C) x = 7","D) x = 175"],"bonne_reponse":2,"explication":"5x = 35 → x = 35 ÷ 5 = 7. Vérif : 5 × 7 = 35 ✓.","annale":"Liste officielle MEN oct. 2025 — Résoudre ax = c"},{"id":"auto_17","niveau":2,"type_brevet":"automatisme","theme_auto":"Équation x + b = c","enonce":"Résoudre : x + 8 = 15","options":["A) x = 23","B) x = 7","C) x = 120","D) x = 8"],"bonne_reponse":1,"explication":"x = 15 − 8 = 7. Vérif : 7 + 8 = 15 ✓.","annale":"Liste officielle MEN oct. 2025 — Résoudre x + b = c"},{"id":"auto_18","niveau":2,"type_brevet":"automatisme","theme_auto":"Équation ax + b = c","enonce":"Résoudre : 2x + 3 = 11","options":["A) x = 7","B) x = 4","C) x = 5","D) x = 2"],"bonne_reponse":1,"explication":"2x = 11 − 3 = 8 → x = 4. Vérif : 2×4+3 = 11 ✓.","annale":"Liste officielle MEN oct. 2025 — Résoudre ax + b = c"},{"id":"auto_19","niveau":1,"type_brevet":"automatisme","theme_auto":"Angles dans un triangle","enonce":"Triangle : deux angles mesurant 65° et 72°. Le troisième mesure ?","options":["A) 137°","B) 53°","C) 43°","D) 47°"],"bonne_reponse":2,"explication":"Somme des angles d'un triangle = 180°. 3e angle = 180 − 65 − 72 = 43°.","annale":"Liste officielle MEN oct. 2025 — Somme des angles d'un triangle"},{"id":"auto_20","niveau":1,"type_brevet":"automatisme","theme_auto":"Angles supplémentaires","enonce":"Deux angles sont supplémentaires. L'un vaut 110°. L'autre vaut ?","options":["A) 250°","B) 70°","C) 80°","D) 55°"],"bonne_reponse":1,"explication":"Supplémentaires → somme = 180°. 180° − 110° = 70°. Complémentaires → somme = 90°.","annale":"Liste officielle MEN oct. 2025 — Angles supplémentaires et complémentaires"},{"id":"auto_21","niveau":1,"type_brevet":"automatisme","theme_auto":"Conversions longueur","enonce":"Convertir 3,5 km en mètres.","options":["A) 35 m","B) 350 m","C) 3500 m","D) 0,35 m"],"bonne_reponse":2,"explication":"1 km = 1000 m. 3,5 × 1000 = 3500 m.","annale":"Liste officielle MEN oct. 2025 — Conversions mm, cm, m, km"},{"id":"auto_22","niveau":2,"type_brevet":"automatisme","theme_auto":"Conversions aires","enonce":"Convertir 2 m² en cm².","options":["A) 200 cm²","B) 2 000 cm²","C) 20 000 cm²","D) 200 000 cm²"],"bonne_reponse":2,"explication":"1 m² = 10 000 cm² (car 1 m = 100 cm et 100² = 10 000). 2 m² = 20 000 cm². PIÈGE : pour les aires, on élève le facteur de conversion au carré !","annale":"Liste officielle MEN oct. 2025 — Conversions mm², cm², m², km²"},{"id":"auto_23","niveau":2,"type_brevet":"automatisme","theme_auto":"Conversions volumes/capacités","enonce":"Convertir 2,5 L en mL.","options":["A) 25 mL","B) 250 mL","C) 2500 mL","D) 25 000 mL"],"bonne_reponse":2,"explication":"1 L = 1000 mL. 2,5 × 1000 = 2500 mL. À savoir : 1 L = 1 dm³ ; 1 m³ = 1000 L.","annale":"Liste officielle MEN oct. 2025 — Conversions mL, cL, dL, L ; dm³, L ; m³, L"},{"id":"auto_24","niveau":2,"type_brevet":"automatisme","theme_auto":"Conversions temps","enonce":"Convertir 1h 45 min en minutes.","options":["A) 145 min","B) 100 min","C) 105 min","D) 90 min"],"bonne_reponse":2,"explication":"1h = 60 min. 1h 45 min = 60 + 45 = 105 min. PIÈGE : 1h45 n'est pas 1,45h (c'est 1,75h en décimal).","annale":"Liste officielle MEN oct. 2025 — Conversions s, min, h, jour"},{"id":"auto_25","niveau":1,"type_brevet":"automatisme","theme_auto":"Périmètre d'un disque","enonce":"Disque de rayon 5 cm. Son périmètre = ? (pi ≈ 3,14)","options":["A) 15,7 cm","B) 31,4 cm","C) 78,5 cm","D) 10 cm"],"bonne_reponse":1,"explication":"Périmètre = 2 × pi × r = 2 × 3,14 × 5 = 31,4 cm. Ne pas confondre avec l'aire = pi × r² = 78,5 cm².","annale":"Liste officielle MEN oct. 2025 — Périmètre d'un disque"},{"id":"auto_26","niveau":1,"type_brevet":"automatisme","theme_auto":"Aire d'un triangle","enonce":"Triangle de base 8 cm et hauteur 5 cm. Aire = ?","options":["A) 40 cm²","B) 13 cm²","C) 20 cm²","D) 80 cm²"],"bonne_reponse":2,"explication":"Aire triangle = (base × hauteur) ÷ 2 = (8 × 5) ÷ 2 = 20 cm². Ne pas oublier le ÷ 2 !","annale":"Liste officielle MEN oct. 2025 — Aire d'un triangle"},{"id":"auto_27","niveau":1,"type_brevet":"automatisme","theme_auto":"Volume d'un pavé droit","enonce":"Pavé droit : L=6 cm, l=4 cm, h=3 cm. Volume = ?","options":["A) 13 cm³","B) 72 cm³","C) 24 cm³","D) 216 cm³"],"bonne_reponse":1,"explication":"V = L × l × h = 6 × 4 × 3 = 72 cm³.","annale":"Liste officielle MEN oct. 2025 — Volume d'un pavé droit"},{"id":"auto_28","niveau":2,"type_brevet":"automatisme","theme_auto":"Volume d'un cylindre","enonce":"Cylindre : rayon 4 cm, hauteur 10 cm. Volume = ? (pi ≈ 3,14)","options":["A) 125,6 cm³","B) 502,4 cm³","C) 1256 cm³","D) 160 cm³"],"bonne_reponse":1,"explication":"V = pi × r² × h = 3,14 × 16 × 10 = 502,4 cm³. Étapes : 1) r²=16 ; 2) × pi ; 3) × h.","annale":"Liste officielle MEN oct. 2025 — Volume d'un cylindre"},{"id":"auto_29","niveau":2,"type_brevet":"automatisme","theme_auto":"Automatisme Pythagore","enonce":"Triangle rectangle, cathètes 3 cm et 4 cm. Hypoténuse = ?","options":["A) 7 cm","B) 5 cm","C) 6 cm","D) 12 cm"],"bonne_reponse":1,"explication":"c² = 3² + 4² = 9 + 16 = 25 → c = 5 cm. Triplet 3-4-5 à mémoriser ! Autres : 5-12-13 ; 8-15-17.","annale":"Liste officielle MEN oct. 2025 — Automatisme Pythagore"},{"id":"auto_30","niveau":2,"type_brevet":"automatisme","theme_auto":"Automatisme cosinus","enonce":"Triangle rectangle, hypoténuse = 10 cm, angle A = 60°. cos(60°) = 0,5. Côté adjacent à A = ?","options":["A) 20 cm","B) 5 cm","C) 8,66 cm","D) 0,05 cm"],"bonne_reponse":1,"explication":"cos(A) = adjacent / hypoténuse → adjacent = 10 × 0,5 = 5 cm. Mémo : CAH = Cosinus = Adjacent / Hypoténuse.","annale":"Liste officielle MEN oct. 2025 — Automatisme cosinus"},{"id":"auto_31","niveau":2,"type_brevet":"automatisme","theme_auto":"Automatisme Thalès","enonce":"Droites parallèles : AB=6, AC=9, DE=4. Calculer DF.","options":["A) DF = 6","B) DF = 3","C) DF = 2,67","D) DF = 8"],"bonne_reponse":0,"explication":"Thalès : AB/AC = DE/DF → 6/9 = 4/DF → DF = 4 × 9/6 = 6. Vérif : 6/9 = 4/6 = 2/3 ✓.","annale":"Liste officielle MEN oct. 2025 — Automatisme Thalès"},{"id":"auto_32","niveau":1,"type_brevet":"automatisme","theme_auto":"Probabilité équiprobabilité","enonce":"On tire une carte au hasard dans un jeu de 52 cartes. P(cœur) = ?","options":["A) 1/52","B) 1/13","C) 1/4","D) 4/52"],"bonne_reponse":2,"explication":"Il y a 13 cœurs sur 52 cartes. P(cœur) = 13/52 = 1/4.","annale":"Liste officielle MEN oct. 2025 — Probabilité équiprobabilité"},{"id":"auto_33","niveau":1,"type_brevet":"automatisme","theme_auto":"Fréquence","enonce":"Sur 40 élèves, 16 ont eu plus de 15/20. Fréquence en % ?","options":["A) 16%","B) 40%","C) 24%","D) 45%"],"bonne_reponse":1,"explication":"Fréquence = 16/40 = 0,4 = 40%. Méthode : diviser le nb d'occurrences par l'effectif total.","annale":"Liste officielle MEN oct. 2025 — Exprimer une fréquence"},{"id":"auto_34","niveau":2,"type_brevet":"automatisme","theme_auto":"Médiane","enonce":"Série ordonnée : 4, 7, 9, 12, 15, 18, 21. Médiane = ?","options":["A) 9","B) 12","C) 15","D) 10"],"bonne_reponse":1,"explication":"7 valeurs → médiane = 4e valeur = 12. Si nb pair de valeurs : moyenne des 2 centrales.","annale":"Liste officielle MEN oct. 2025 — Déterminer une médiane"},{"id":"auto_35","niveau":1,"type_brevet":"automatisme","theme_auto":"Proportionnalité — retour à l'unité","enonce":"3 kg de pommes coûtent 4,50 €. Combien coûtent 5 kg ?","options":["A) 6,50 €","B) 7,50 €","C) 8 €","D) 5,50 €"],"bonne_reponse":1,"explication":"Retour à l'unité : 1 kg = 4,50 ÷ 3 = 1,50 €. 5 kg = 5 × 1,50 = 7,50 €.","annale":"Liste officielle MEN oct. 2025 — Proportionnalité / retour à l'unité"},{"id":"auto_36","niveau":2,"type_brevet":"automatisme","theme_auto":"Reconnaître la proportionnalité","enonce":"Graphique : x=4→y=6 ; x=8→y=12. Est-ce de la proportionnalité ?","options":["A) Non, les valeurs changent","B) Oui, le rapport y/x = 1,5 est constant","C) Non, y augmente trop","D) On ne peut pas savoir"],"bonne_reponse":1,"explication":"y/x = 6/4 = 1,5 et 12/8 = 1,5 → rapport constant → proportionnalité. La droite passe par l'origine.","annale":"Liste officielle MEN oct. 2025 — Reconnaître la proportionnalité"},{"id":"auto_37","niveau":1,"type_brevet":"automatisme","theme_auto":"Image et antécédent graphique","enonce":"Sur un graphique, pour x=3 la courbe est en y=7. Que signifie f(3)=7 ?","options":["A) L'antécédent de 3 est 7","B) L'image de 3 par f est 7","C) f ne peut pas valoir 7","D) x=7 est un antécédent de 3"],"bonne_reponse":1,"explication":"f(3)=7 : l'IMAGE de 3 est 7. L'antécédent de 7 est 3 (pas l'inverse). Image = résultat, antécédent = valeur de départ.","annale":"Liste officielle MEN oct. 2025 — Exploiter un graphique"},{"id":"auto_38","niveau":2,"type_brevet":"automatisme","theme_auto":"Pente d'une droite","enonce":"Une droite passe par (0;2) et (5;12). Coefficient directeur = ?","options":["A) 2","B) 12","C) 10","D) 5"],"bonne_reponse":0,"explication":"Pente = (12-2)/(5-0) = 10/5 = 2. La pente = variation de y quand x augmente de 1.","annale":"Liste officielle MEN oct. 2025 — Lire et interpréter un graphique"},{"id":"auto_39","niveau":2,"type_brevet":"automatisme","theme_auto":"Programme de calcul","enonce":"Programme : 'Prendre un nombre, × 3, + 5, ÷ 2'. Résultat avec 7 ?","options":["A) 10","B) 13","C) 16","D) 8"],"bonne_reponse":1,"explication":"7×3=21 ; 21+5=26 ; 26÷2=13. Appliquer les opérations DANS L'ORDRE.","annale":"Liste officielle MEN oct. 2025 — Interpréter un programme de calcul"},{"id":"auto_40","niveau":3,"type_brevet":"automatisme","theme_auto":"Inverser un programme de calcul","enonce":"Programme : 'Prendre x, calculer 2x+1'. Pour quel x obtient-on 15 ?","options":["A) x=6","B) x=7","C) x=8","D) x=14"],"bonne_reponse":1,"explication":"2x+1=15 → 2x=14 → x=7. Vérif : 2×7+1=15 ✓. 'Inverser' le programme = résoudre une équation.","annale":"Liste officielle MEN oct. 2025 — Interpréter un programme de calcul"},{"id":"auto_41","niveau":1,"type_brevet":"automatisme","theme_auto":"Droite graduée","enonce":"Sur une droite graduée, le milieu entre -3 et 5 est ?","options":["A) 1","B) 2","C) -1","D) 4"],"bonne_reponse":0,"explication":"Milieu = (-3+5)/2 = 2/2 = 1. La liste MEN précise : 'lire l'abscisse d'un point et placer un point d'abscisse donnée'.","annale":"Liste officielle MEN oct. 2025 — Droite graduée"},{"id":"auto_42","niveau":1,"type_brevet":"automatisme","theme_auto":"Symétrie axiale","enonce":"Le symétrique du point A(2;5) par rapport à l'axe des ordonnées (axe y) est ?","options":["A) (-2;5)","B) (2;-5)","C) (-2;-5)","D) (5;2)"],"bonne_reponse":0,"explication":"Symétrie par rapport à l'axe y : l'abscisse change de signe, l'ordonnée reste. A(2;5) → A'(-2;5).","annale":"Liste officielle MEN oct. 2025 — Symétrie axiale"}]},{"id":"maths_02","titre":"Nombres et calculs — fractions, puissances, racines","theme":"Nombres et calculs","statut":"a_reviser","priorite":"haute","fiche":"Maîtriser : opérations sur fractions, puissances entières (a^n), notation scientifique (3,2 × 10^5), racine carrée (√). Savoir simplifier des expressions, factoriser. Connaître les priorités opératoires (parenthèses > puissances > × ÷ > + -).","mots_cles":["fractions","puissances","racines","priorités opératoires","notation scientifique"],"quiz":[{"id":"q_maths_02_01","enonce":"Quelle est la valeur de 2^3 × 2^4 ?","options":["A) 2^7","B) 2^12","C) 4^7","D) 2^1"],"bonne_reponse":0,"explication":"Règle des puissances de même base : a^m × a^n = a^(m+n). Donc 2^3 × 2^4 = 2^(3+4) = 2^7 = 128.","type":"qcm","difficulte":"facile"},{"id":"q_maths_02_02","enonce":"Simplifie : (3/5) ÷ (9/10)","options":["A) 27/50","B) 2/3","C) 3/2","D) 5/6"],"bonne_reponse":1,"explication":"Diviser par une fraction = multiplier par son inverse. (3/5) ÷ (9/10) = (3/5) × (10/9) = 30/45 = 2/3. On simplifie par 15.","type":"qcm","difficulte":"moyen"},{"id":"q_maths_02_03","enonce":"Exprime 0,000045 en notation scientifique.","options":["A) 4,5 × 10^-5","B) 45 × 10^-6","C) 4,5 × 10^5","D) 0,45 × 10^-4"],"bonne_reponse":0,"explication":"La notation scientifique impose a × 10^n avec 1 ≤ a < 10. On déplace la virgule de 5 rangs vers la droite : 4,5 × 10^-5.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Toujours vérifier la notation scientifique : 1 ≤ a < 10. Simplifier les fractions AVANT de calculer."},{"id":"maths_03","titre":"Algèbre — équations et inéquations","theme":"Algèbre","statut":"a_reviser","priorite":"haute","fiche":"Résoudre des équations du 1er degré (ax + b = c), des systèmes de deux équations à deux inconnues (substitution ou addition), des inéquations (attention au signe quand on divise par un négatif). Développer et factoriser des expressions algébriques.","mots_cles":["équation","inéquation","système","développer","factoriser"],"quiz":[{"id":"q_maths_03_01","enonce":"Résous l'équation : 3x - 7 = 2x + 5","options":["A) x = -2","B) x = 12","C) x = 2","D) x = 6"],"bonne_reponse":1,"explication":"3x - 2x = 5 + 7 → x = 12. Toujours regrouper les termes en x d'un côté et les constantes de l'autre.","type":"qcm","difficulte":"facile"},{"id":"q_maths_03_02","enonce":"Développe et réduis : (x + 3)(x - 2)","options":["A) x² + x - 6","B) x² - 6","C) x² + x + 6","D) x² - x - 6"],"bonne_reponse":0,"explication":"Double distributivité : x×x + x×(-2) + 3×x + 3×(-2) = x² - 2x + 3x - 6 = x² + x - 6.","type":"qcm","difficulte":"moyen"},{"id":"q_maths_03_03","enonce":"Résous le système : { 2x + y = 7 ; x - y = 2 }","options":["A) x=3, y=1","B) x=1, y=5","C) x=2, y=3","D) x=4, y=-1"],"bonne_reponse":0,"explication":"Par addition : (2x+y) + (x-y) = 7+2 → 3x = 9 → x = 3. Puis y = 7 - 2×3 = 1. Vérification : 3 - 1 = 2 ✓","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"TOUJOURS vérifier la solution en la remplaçant dans l'équation de départ."},{"id":"maths_04","titre":"Géométrie plane — Pythagore, Thalès, trigonométrie","theme":"Géométrie","statut":"a_reviser","priorite":"haute","fiche":"Théorème de Pythagore et sa réciproque (triangle rectangle). Théorème de Thalès (droites parallèles, rapports). Trigonométrie dans le triangle rectangle : sin = opp/hyp, cos = adj/hyp, tan = opp/adj. Connaître les valeurs remarquables (30°, 45°, 60°).","mots_cles":["Pythagore","Thalès","trigonométrie","triangle rectangle","sin cos tan"],"quiz":[{"id":"q_maths_04_01","enonce":"Dans un triangle rectangle, les deux côtés de l'angle droit mesurent 6 cm et 8 cm. Quelle est la longueur de l'hypoténuse ?","options":["A) 12 cm","B) 14 cm","C) 10 cm","D) 9 cm"],"bonne_reponse":2,"explication":"Pythagore : c² = 6² + 8² = 36 + 64 = 100. Donc c = 10 cm. C'est le célèbre triplet pythagoricien 3-4-5 (× 2).","type":"qcm","difficulte":"facile"},{"id":"q_maths_04_02","enonce":"Dans un triangle rectangle, l'angle A vaut 35° et l'hypoténuse mesure 10 cm. Quelle est la longueur du côté adjacent à A ?","options":["A) 10 × sin(35°)","B) 10 × tan(35°)","C) 10 × cos(35°)","D) 10 / cos(35°)"],"bonne_reponse":2,"explication":"cos(A) = adjacent/hypoténuse, donc adjacent = hypoténuse × cos(A) = 10 × cos(35°) ≈ 8,19 cm.","type":"qcm","difficulte":"moyen"},{"id":"q_maths_04_03","enonce":"Deux droites parallèles coupent deux sécantes. On obtient AB = 4, AC = 6 et DE = 6. Quelle est la longueur DF selon Thalès ?","options":["A) 8","B) 9","C) 4","D) 12"],"bonne_reponse":1,"explication":"Thalès : AB/AC = DE/DF → 4/6 = 6/DF → DF = 6×6/4 = 9.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Pour Pythagore : identifie l'hypoténuse (côté opposé à l'angle droit). Pour Thalès : dessine les droites parallèles."},{"id":"maths_05","titre":"Fonctions — représentations et variations","theme":"Fonctions","statut":"a_reviser","priorite":"moyenne","fiche":"Notion de fonction, image et antécédent. Fonctions affines f(x) = ax + b (pente a, ordonnée à l'origine b). Tableau de valeurs, représentation graphique. Lecture graphique : lire une image, trouver un antécédent. Variations (croissante, décroissante, constante).","mots_cles":["fonction","image","antécédent","fonction affine","variations","graphique"],"quiz":[{"id":"q_maths_05_01","enonce":"La fonction f est définie par f(x) = 2x - 3. Quelle est l'image de 5 par f ?","options":["A) 4","B) 7","C) 13","D) 3"],"bonne_reponse":1,"explication":"f(5) = 2×5 - 3 = 10 - 3 = 7. L'image de 5 par f est 7. On remplace simplement x par 5 dans la formule.","type":"qcm","difficulte":"facile"},{"id":"q_maths_05_02","enonce":"La droite représentant f(x) = -2x + 4 est :","options":["A) Croissante, pente +2","B) Décroissante, coupe l'axe y en 4","C) Croissante, coupe l'axe y en -2","D) Constante"],"bonne_reponse":1,"explication":"Le coefficient directeur a = -2 < 0 donc la droite est décroissante. L'ordonnée à l'origine b = 4 donc elle coupe l'axe y en y = 4.","type":"qcm","difficulte":"moyen"},{"id":"q_maths_05_03","enonce":"Quel est l'antécédent de 0 par f(x) = 3x - 6 ?","options":["A) -6","B) 6","C) 2","D) 0"],"bonne_reponse":2,"explication":"Trouver l'antécédent de 0 : on résout f(x) = 0 → 3x - 6 = 0 → 3x = 6 → x = 2. L'antécédent de 0 est 2 (c'est aussi la racine de f).","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Image = tu connais x, tu calcules y. Antécédent = tu connais y, tu cherches x. Ne pas confondre !"},{"id":"maths_06","titre":"Statistiques et probabilités","theme":"Données et hasard","statut":"a_reviser","priorite":"moyenne","fiche":"Statistiques : moyenne (pondérée), médiane, étendue, quartiles (Q1, Q2, Q3), diagramme en boîte. Probabilités : fréquence, loi des grands nombres, probabilité d'un événement P(A) = cas favorables/cas possibles. Arbre de probabilités.","mots_cles":["moyenne","médiane","quartile","probabilité","arbre","fréquence"],"quiz":[{"id":"q_maths_06_01","enonce":"Les notes de Lucas sont : 8, 12, 14, 10, 16. Quelle est sa moyenne ?","options":["A) 11","B) 12","C) 13","D) 10"],"bonne_reponse":1,"explication":"(8 + 12 + 14 + 10 + 16) ÷ 5 = 60 ÷ 5 = 12. La moyenne est 12. On additionne toutes les valeurs puis on divise par leur nombre.","type":"qcm","difficulte":"facile"},{"id":"q_maths_06_02","enonce":"On lance un dé équilibré à 6 faces. Quelle est la probabilité d'obtenir un nombre pair ?","options":["A) 1/3","B) 1/6","C) 2/3","D) 1/2"],"bonne_reponse":3,"explication":"Nombres pairs sur un dé : {2, 4, 6} soit 3 cas favorables sur 6 possibles. P(pair) = 3/6 = 1/2.","type":"qcm","difficulte":"facile"},{"id":"q_maths_06_03","enonce":"Une série de 9 valeurs ordonnées est : 3, 5, 7, 8, 10, 11, 13, 15, 18. Quelle est la médiane ?","options":["A) 8","B) 9","C) 10","D) 11"],"bonne_reponse":2,"explication":"La médiane est la valeur centrale d'une série ordonnée. Ici 9 valeurs → la médiane est la 5e valeur = 10.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Pour la médiane : TOUJOURS trier d'abord. Pour les probabilités : vérifier que la somme des branches = 1."},{"id":"maths_07","titre":"Géométrie dans l'espace — volumes et sections","theme":"Géométrie","statut":"a_reviser","priorite":"moyenne","fiche":"Formules de volumes : cube (a³), parallélépipède (L×l×h), prisme (B×h), cylindre (πr²h), pyramide (B×h/3), cône (πr²h/3), sphère (4πr³/3). Représentation en perspective. Sections planes de solides.","mots_cles":["volume","cube","cylindre","pyramide","sphère","section"],"quiz":[{"id":"q_maths_07_01","enonce":"Un cylindre a un rayon de 3 cm et une hauteur de 5 cm. Quel est son volume ? (π ≈ 3,14)","options":["A) 47,1 cm³","B) 94,2 cm³","C) 141,3 cm³","D) 30 cm³"],"bonne_reponse":2,"explication":"V = πr²h = 3,14 × 3² × 5 = 3,14 × 9 × 5 = 3,14 × 45 = 141,3 cm³.","type":"qcm","difficulte":"moyen"},{"id":"q_maths_07_02","enonce":"Une pyramide à base carrée de côté 4 cm et de hauteur 6 cm. Quel est son volume ?","options":["A) 96 cm³","B) 48 cm³","C) 32 cm³","D) 16 cm³"],"bonne_reponse":2,"explication":"V = (Base × hauteur) / 3 = (4² × 6) / 3 = (16 × 6) / 3 = 96 / 3 = 32 cm³.","type":"qcm","difficulte":"moyen"},{"id":"q_maths_07_03","enonce":"Quelle section obtient-on en coupant une sphère par un plan passant par son centre ?","options":["A) Une ellipse","B) Un cercle","C) Un ovale","D) Un carré"],"bonne_reponse":1,"explication":"Toute section plane d'une sphère est un cercle. La section passant par le centre est un grand cercle de rayon égal au rayon de la sphère.","type":"qcm","difficulte":"facile"}],"conseil_strategique":"Apprendre les formules par cœur — elles ne sont PAS données au brevet ! 1 L = 1 dm³ = 1000 cm³."},{"id":"maths_08","titre":"Algorithmique et programmation Python","theme":"Informatique","statut":"a_reviser","priorite":"moyenne","fiche":"Lire et écrire un algorithme simple. En Python : variables, affectation (=), affichage (print), saisie (input), conditions (if/elif/else), boucles (for, while), fonctions (def). Comprendre ce que produit un programme donné. Exercice obligatoire au Brevet.","mots_cles":["algorithme","Python","variable","boucle","condition","fonction"],"quiz":[{"id":"q_maths_08_01","enonce":"Que produit ce programme Python ?\n n = 1\n while n <= 5:\n   print(n)\n   n = n + 2","options":["A) 1 2 3 4 5","B) 1 3 5","C) 2 4 6","D) 1 3 5 7"],"bonne_reponse":1,"explication":"n part de 1, on affiche n puis on ajoute 2. Donc : 1 (1+2=3), 3 (3+2=5), 5 (5+2=7 > 5 on s'arrête). La boucle produit 1, 3, 5.","type":"qcm","difficulte":"moyen"},{"id":"q_maths_08_02","enonce":"Quelle instruction Python permet d'afficher 'Bonjour' à l'écran ?","options":["A) display('Bonjour')","B) echo 'Bonjour'","C) print('Bonjour')","D) show('Bonjour')"],"bonne_reponse":2,"explication":"En Python, la fonction print() permet d'afficher du texte ou des valeurs à l'écran. C'est la fonction d'affichage de base.","type":"qcm","difficulte":"facile"},{"id":"q_maths_08_03","enonce":"Que vaut x après ces instructions : x = 5 ; x = x * 2 + 1 ?","options":["A) 5","B) 10","C) 11","D) 12"],"bonne_reponse":2,"explication":"x = 5, puis x = 5 × 2 + 1 = 10 + 1 = 11. En programmation, le = est une affectation : on calcule le membre droit puis on l'assigne à la variable.","type":"qcm","difficulte":"facile"}],"conseil_strategique":"Trace le programme étape par étape sur papier. Note la valeur de chaque variable à chaque ligne."}],"conseil_strategique":"Commence TOUJOURS par les automatismes (20 min, sans calculatrice). Ce sont des points quasi gratuits si tu t'entraînes. Montre TOUJOURS ta démarche dans la 2e partie."},{"id":"francais","label":"Français","emoji":"📖","couleur":"#9B5DE5","couleur_fond":"#F3EDFE","duree_epreuve":"3h","coeff":2,"date_epreuve":"2026-06-26","lien_eduscol":"https://eduscol.education.fr/1613/programmes-et-ressources-en-francais-voie-gt","chapitres":[{"id":"fr_01","titre":"Compréhension de texte — lecture et analyse","theme":"Lecture","statut":"a_reviser","priorite":"haute","fiche":"L'épreuve commence par un texte littéraire (roman, nouvelle, autobiographie...). Il faut : identifier le genre et le registre, repérer le point de vue narratif (interne, externe, omniscient), reformuler les idées importantes, identifier les procédés stylistiques (comparaison, métaphore, hyperbole, antithèse...), comprendre l'implicite du texte.","mots_cles":["compréhension","narrateur","point de vue","registre","figure de style"],"quiz":[{"id":"q_fr_01_01","enonce":"Dans un récit à la 1ère personne où le narrateur ne connaît que ses propres pensées, le point de vue est :","options":["A) Omniscient","B) Interne","C) Externe","D) Subjectif"],"bonne_reponse":1,"explication":"Le point de vue interne : le narrateur voit le monde à travers les yeux d'un seul personnage et n'a accès qu'à ses propres pensées et émotions.","type":"qcm","difficulte":"moyen"},{"id":"q_fr_01_02","enonce":"\"Ses yeux étaient deux étoiles\" est un exemple de :","options":["A) Comparaison","B) Métaphore","C) Hyperbole","D) Personnification"],"bonne_reponse":1,"explication":"Une métaphore compare sans outil de comparaison (comme, tel, ainsi que...). Ici on assimile directement les yeux à des étoiles. Si on avait dit \"comme des étoiles\", ce serait une comparaison.","type":"qcm","difficulte":"facile"},{"id":"q_fr_01_03","enonce":"Le registre d'un texte qui vise à faire rire par l'absurde et l'exagération est :","options":["A) Tragique","B) Lyrique","C) Comique","D) Épique"],"bonne_reponse":2,"explication":"Le registre comique vise à faire rire (ironie, parodie, absurde, exagération). Le lyrique exprime des sentiments, le tragique montre la fatalité, l'épique célèbre des exploits.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Souligne le texte pendant la lecture. Citation entre guillemets + analyse pour chaque réponse."},{"id":"fr_02","titre":"Grammaire et conjugaison","theme":"Langue","statut":"a_reviser","priorite":"haute","fiche":"Réviser : les classes grammaticales (nom, verbe, adjectif, pronom, déterminant, adverbe, préposition, conjonction). Les fonctions (sujet, COD, COI, attribut, complément circonstanciel). Les temps : présent, imparfait, passé simple, passé composé, futur, conditionnel, subjonctif. Discours direct et indirect.","mots_cles":["classes grammaticales","fonctions","conjugaison","temps","subjonctif","discours indirect"],"quiz":[{"id":"q_fr_02_01","enonce":"Dans \"Le chat mange la souris\", quel est la fonction de \"la souris\" ?","options":["A) Sujet","B) COI","C) COD","D) Attribut du sujet"],"bonne_reponse":2,"explication":"\"La souris\" est le COD (Complément d'Objet Direct) car il répond à la question \"mange quoi ?\". Il n'y a pas de préposition entre le verbe et le groupe nominal.","type":"qcm","difficulte":"facile"},{"id":"q_fr_02_02","enonce":"Conjugue \"finir\" au subjonctif présent, à la 3e personne du singulier.","options":["A) qu'il finira","B) qu'il finisse","C) qu'il finit","D) qu'il finirait"],"bonne_reponse":1,"explication":"Subjonctif présent de \"finir\" : que je finisse, que tu finisses, qu'il finisse... Il est utilisé après des verbes d'obligation, de doute, de souhait (ex : \"il faut que tu finisses\").","type":"qcm","difficulte":"moyen"},{"id":"q_fr_02_03","enonce":"Transforme au discours indirect : Il dit : \"Je viendrai demain.\"","options":["A) Il dit qu'il vient demain","B) Il dit qu'il viendrait le lendemain","C) Il dit qu'il viendra le lendemain","D) Il dit qu'il venait le lendemain"],"bonne_reponse":1,"explication":"Au discours indirect passé : \"viendrai\" → conditionnel \"viendrait\", \"demain\" → \"le lendemain\". Attention aux concordances des temps et aux changements de repères temporels.","type":"qcm","difficulte":"difficile"}],"conseil_strategique":"Subjonctif irréguliers à mémoriser : être→soit, avoir→ait, aller→aille, faire→fasse, pouvoir→puisse."},{"id":"fr_03","titre":"Orthographe et dictée","theme":"Langue","statut":"a_reviser","priorite":"haute","fiche":"Points clés du Brevet : accord du participe passé (avec être → accord sujet ; avec avoir → accord COD placé avant), accord de l'adjectif, homophones (a/à, est/et/es, son/sont, ces/ses, ou/où, mais/mes, on/ont), pluriel des noms composés. S'entraîner avec des dictées en ligne.","mots_cles":["accord","participe passé","homophones","pluriel","dictée"],"quiz":[{"id":"q_fr_03_01","enonce":"Choisir la bonne orthographe : \"Les fleurs qu'il ___ cueillies étaient belles.\"","options":["A) a","B) à","C) as","D) ah"],"bonne_reponse":0,"explication":"\"a\" = auxiliaire avoir (il a). Le participe \"cueillies\" s'accorde avec le COD \"que\" (mis pour \"les fleurs\", féminin pluriel) placé avant. Règle : participe passé avec avoir → accord avec le COD si placé avant.","type":"qcm","difficulte":"moyen"},{"id":"q_fr_03_02","enonce":"Laquelle de ces phrases est correctement orthographiée ?","options":["A) Il sont partis tôt.","B) On a mangé tous les gâteaux.","C) Ces livres sont a moi.","D) Ou est-il allé ?"],"bonne_reponse":1,"explication":"\"On a mangé\" est correct (on = pronom sujet, a = auxiliaire avoir). Erreurs : \"Il sont\" → ils sont ; \"a moi\" → à moi ; \"Ou\" → Où (accent quand = lieu).","type":"qcm","difficulte":"moyen"},{"id":"q_fr_03_03","enonce":"\"Les pommes de terre\" au pluriel s'écrit :","options":["A) les pomme-de-terres","B) les pommes-de-terres","C) les pommes de terre","D) les pommes-de-terre"],"bonne_reponse":2,"explication":"\"Pommes de terre\" : seul le premier nom prend le pluriel (les pommes). \"Terre\" reste invariable car c'est un complément de nom introduit sans article. Sans trait d'union dans l'usage courant.","type":"qcm","difficulte":"difficile"}],"conseil_strategique":"Participe passé avec avoir : 1) Trouver le COD 2) Est-il AVANT le verbe ? 3) Si oui → accord."},{"id":"fr_04","titre":"Rédaction — lettre, récit, argumentation","theme":"Écriture","statut":"a_reviser","priorite":"haute","fiche":"Le Brevet propose un sujet de rédaction : soit un récit (suite de texte, description), soit une lettre (formelle ou amicale), soit un texte argumentatif. Critères évalués : respect de la consigne, cohérence du propos, richesse du vocabulaire, variété des tournures, orthographe. Toujours faire un brouillon-plan (5 min).","mots_cles":["rédaction","lettre","argumentation","récit","plan","cohérence"],"quiz":[{"id":"q_fr_04_01","enonce":"Une lettre formelle se termine par :","options":["A) Bises !","B) À plus !","C) Veuillez agréer, Madame, mes salutations distinguées.","D) Cordialement, votre ami."],"bonne_reponse":2,"explication":"La formule de politesse d'une lettre formelle reprend le titre du destinataire utilisé en en-tête. Elle est longue et soutenue. \"Cordialement\" est semi-formel, \"Bises\" et \"À plus\" sont familiers.","type":"qcm","difficulte":"facile"},{"id":"q_fr_04_02","enonce":"Dans un texte argumentatif, l'ordre idéal est :","options":["A) Exemples → thèse → argument","B) Thèse → arguments → exemples → conclusion","C) Conclusion → arguments → thèse","D) Exemples → conclusion → thèse"],"bonne_reponse":1,"explication":"Structure argumentative : 1) Thèse (position), 2) Arguments (raisons), 3) Exemples (illustrations), 4) Conclusion (synthèse + ouverture). Chaque argument = 1 paragraphe.","type":"qcm","difficulte":"moyen"},{"id":"q_fr_04_03","enonce":"Pour relier deux idées qui s'opposent dans un texte argumentatif, on utilise :","options":["A) De plus, en outre","B) Ainsi, donc, c'est pourquoi","C) Cependant, néanmoins, en revanche","D) D'abord, ensuite, enfin"],"bonne_reponse":2,"explication":"Les connecteurs d'opposition : cependant, néanmoins, en revanche, toutefois, or... Les connecteurs d'addition : de plus, en outre. Les connecteurs de cause/conséquence : donc, ainsi. Les connecteurs d'ordre : d'abord, ensuite.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Toujours faire un plan (5 min). Structure = introduction + 2-3 paragraphes + conclusion."}]},{"id":"histoire_geo","label":"Histoire-Géographie & EMC","emoji":"🌍","couleur":"#C44B4B","couleur_fond":"#FDEAEA","duree_epreuve":"2h","coeff":2,"date_epreuve":"2026-06-29","lien_eduscol":"https://eduscol.education.fr/1614/programmes-et-ressources-en-histoire-geographie-voie-gt","chapitres":[{"id":"hg_01","titre":"La Seconde Guerre mondiale et ses conséquences","theme":"Histoire","statut":"a_reviser","priorite":"haute","fiche":"1939-1945 : causes, grandes étapes (Blitzkrieg, opération Barbarossa, Débarquement 1944, capitulations). Génocide des Juifs et des Tsiganes — Shoah. France : régime de Vichy, collaboration, Résistance, de Gaulle et la France Libre. Bilan : 60 millions de morts, plan Marshall, ONU fondée en 1945.","mots_cles":["Seconde Guerre mondiale","Shoah","Résistance","Vichy","de Gaulle","ONU"],"quiz":[{"id":"q_hg_01_01","enonce":"En quelle année est fondée l'Organisation des Nations Unies (ONU) ?","options":["A) 1944","B) 1945","C) 1947","D) 1948"],"bonne_reponse":1,"explication":"L'ONU est fondée en 1945 lors de la conférence de San Francisco (26 juin 1945), à la fin de la Seconde Guerre mondiale, avec pour mission de maintenir la paix internationale.","type":"qcm","difficulte":"facile"},{"id":"q_hg_01_02","enonce":"Qu'est-ce que le régime de Vichy (1940-1944) ?","options":["A) Le gouvernement de la Résistance française","B) Le gouvernement collaborateur français sous Pétain","C) L'armée française libre de De Gaulle","D) Le parlement français en exil"],"bonne_reponse":1,"explication":"Le régime de Vichy est le gouvernement français dirigé par le maréchal Pétain après la défaite de 1940. Il collabore avec l'Allemagne nazie et participe notamment à la déportation des Juifs de France.","type":"qcm","difficulte":"moyen"},{"id":"q_hg_01_03","enonce":"La Shoah désigne :","options":["A) La capitulation de l'Allemagne nazie","B) Le génocide des Juifs d'Europe par les nazis","C) Le bombardement de Hiroshima","D) L'invasion de l'URSS par Hitler"],"bonne_reponse":1,"explication":"La Shoah (\"catastrophe\" en hébreu) désigne le génocide systématique de 6 millions de Juifs d'Europe organisé par le régime nazi. Elle inclut aussi le génocide des Tsiganes (Porajmos).","type":"qcm","difficulte":"facile"}],"conseil_strategique":"5 dates clés : 1939 ; 1941 (USA+URSS) ; 1944 (Débarquement) ; mai 1945 ; août 1945."},{"id":"hg_02","titre":"La Guerre froide (1947-1991)","theme":"Histoire","statut":"a_reviser","priorite":"haute","fiche":"Bipolarisation du monde : bloc occidental (USA, OTAN) vs bloc soviétique (URSS, Pacte de Varsovie). Grandes crises : Berlin (1961-mur), Cuba (1962), Vietnam. Décolonisation et non-alignement. Détente puis Glasnost/Perestroïka (Gorbatchev). Chute du mur de Berlin 1989, dissolution URSS 1991.","mots_cles":["Guerre froide","bloc occidental","URSS","mur de Berlin","Cuba","OTAN"],"quiz":[{"id":"q_hg_02_01","enonce":"En quelle année le mur de Berlin est-il tombé ?","options":["A) 1985","B) 1987","C) 1989","D) 1991"],"bonne_reponse":2,"explication":"Le mur de Berlin tombe le 9 novembre 1989. C'est le symbole de la fin de la Guerre froide. L'URSS se dissout deux ans plus tard, en 1991.","type":"qcm","difficulte":"facile"},{"id":"q_hg_02_02","enonce":"La crise de Cuba (1962) oppose :","options":["A) France et Royaume-Uni","B) USA et URSS à propos de missiles soviétiques à Cuba","C) USA et Cuba directement","D) OTAN et Pacte de Varsovie en Europe"],"bonne_reponse":1,"explication":"En 1962, les USA découvrent des missiles soviétiques à Cuba, à 150 km de leur côte. Kennedy et Khrouchtchev s'affrontent 13 jours — l'humanité frôle la guerre nucléaire. Les missiles sont retirés.","type":"qcm","difficulte":"moyen"},{"id":"q_hg_02_03","enonce":"Le plan Marshall (1947) est :","options":["A) Un traité militaire entre USA et Europe","B) Un plan d'aide économique américain pour reconstruire l'Europe","C) La création de l'OTAN","D) Un accord de paix entre USA et URSS"],"bonne_reponse":1,"explication":"Le plan Marshall est un programme d'aide économique américain pour aider à reconstruire l'Europe occidentale après la WWII (13 milliards de dollars). Il vise aussi à contenir l'influence soviétique.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"3 crises : Berlin 1961, Cuba 1962, Vietnam 1955-1975. Pour chaque : acteurs + enjeu + issue."},{"id":"hg_03","titre":"La France de la Ve République","theme":"Histoire","statut":"a_reviser","priorite":"haute","fiche":"Fondée en 1958 par de Gaulle. Institutions : Président de la République (5 ans), Premier ministre, Assemblée nationale, Sénat, Conseil constitutionnel. Grands présidents : de Gaulle, Pompidou, Giscard, Mitterrand, Chirac, Sarkozy, Hollande, Macron. Mai 68, construction européenne, décentralisation 1982.","mots_cles":["Ve République","de Gaulle","institutions","président","parlement","1958"],"quiz":[{"id":"q_hg_03_01","enonce":"En quelle année est fondée la Ve République française ?","options":["A) 1945","B) 1946","C) 1958","D) 1962"],"bonne_reponse":2,"explication":"La Ve République est fondée en 1958 par le général de Gaulle, après la crise algérienne qui a entraîné la chute de la IVe République. La nouvelle Constitution renforce le pouvoir exécutif.","type":"qcm","difficulte":"facile"},{"id":"q_hg_03_02","enonce":"Quelle est la durée du mandat présidentiel en France depuis 2000 ?","options":["A) 4 ans","B) 5 ans","C) 6 ans","D) 7 ans"],"bonne_reponse":1,"explication":"Depuis le référendum de 2000, le mandat présidentiel est de 5 ans (quinquennat) au lieu de 7 ans (septennat). Le Président est rééligible une fois.","type":"qcm","difficulte":"facile"},{"id":"q_hg_03_03","enonce":"Que se passe-t-il en France en Mai 1968 ?","options":["A) Une guerre civile éclate","B) Un mouvement de contestation sociale et culturelle majeur","C) De Gaulle est réélu triomphalement","D) La France entre dans l'Union Européenne"],"bonne_reponse":1,"explication":"Mai 68 est un vaste mouvement de contestation : grèves étudiantes puis grève générale (10 millions de grévistes). Il remet en cause l'autorité, les valeurs traditionnelles et transforme profondément la société française.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Connaître le rôle de chaque institution. Président élu au suffrage universel direct depuis 1962."},{"id":"hg_04","titre":"Géographie — La France et ses territoires","theme":"Géographie","statut":"a_reviser","priorite":"haute","fiche":"Organisation du territoire français : métropoles (Paris, Lyon, Marseille, Bordeaux...), espaces ruraux, littoraux, montagnards. Aménagement du territoire : politiques de rééquilibrage, TGV, décentralisation. DOM-TOM. France dans l'UE. Métropolisation et périurbanisation.","mots_cles":["métropole","territoire","aménagement","métropolisation","DOM","décentralisation"],"quiz":[{"id":"q_hg_04_01","enonce":"La métropolisation désigne :","options":["A) La création de nouvelles villes","B) La concentration des populations et activités dans les grandes villes","C) L'exode rural vers les campagnes","D) La construction de métros dans les villes"],"bonne_reponse":1,"explication":"La métropolisation est le processus par lequel les grandes villes (métropoles) concentrent toujours plus de populations, d'emplois, de fonctions économiques et culturelles au détriment des espaces ruraux.","type":"qcm","difficulte":"moyen"},{"id":"q_hg_04_02","enonce":"Combien de régions compte la France métropolitaine depuis la réforme de 2016 ?","options":["A) 22","B) 18","C) 13","D) 16"],"bonne_reponse":2,"explication":"Depuis la réforme territoriale de 2016, la France métropolitaine compte 13 régions (contre 22 auparavant). En ajoutant les 5 régions ultramarines, la France compte 18 régions au total.","type":"qcm","difficulte":"moyen"},{"id":"q_hg_04_03","enonce":"Qu'est-ce qu'un DOM (Département d'Outre-Mer) ?","options":["A) Un territoire français indépendant","B) Une colonie française","C) Un département français situé hors de l'Europe continental","D) Un territoire sous mandat de l'ONU"],"bonne_reponse":2,"explication":"Les DOM sont des départements français à part entière, soumis aux mêmes lois que la métropole. Les 5 DOM-Régions : Guadeloupe, Martinique, Guyane, La Réunion, Mayotte.","type":"qcm","difficulte":"facile"}],"conseil_strategique":"Savoir localiser les 5 DOM. Distinguer métropolisation (processus) et métropole (ville)."},{"id":"hg_05","titre":"Géographie mondiale — inégalités et développement","theme":"Géographie","statut":"a_reviser","priorite":"moyenne","fiche":"Nord/Sud : pays développés vs pays en développement. Indicateurs : IDH (Indice de Développement Humain), PIB/habitant, espérance de vie, taux de scolarisation. Pays émergents (BRICS). Mondialisation : FTN (firmes transnationales), flux commerciaux, zones économiques. Développement durable : ODD, COP.","mots_cles":["IDH","développement","mondialisation","BRICS","inégalités","développement durable"],"quiz":[{"id":"q_hg_05_01","enonce":"L'IDH (Indice de Développement Humain) mesure :","options":["A) Uniquement le PIB par habitant","B) Le bonheur des habitants","C) Le niveau de vie, l'éducation et l'espérance de vie","D) La richesse naturelle d'un pays"],"bonne_reponse":2,"explication":"L'IDH est un indicateur composite mesurant 3 dimensions : niveau de vie (revenu/habitant), éducation (durée de scolarisation), et santé (espérance de vie). Il varie de 0 à 1.","type":"qcm","difficulte":"moyen"},{"id":"q_hg_05_02","enonce":"Le sigle BRICS désigne un groupe de pays :","options":["A) Développés et membres de l'OCDE","B) Émergents à forte croissance économique","C) Les plus pauvres du monde","D) Membres de l'Union Européenne"],"bonne_reponse":1,"explication":"BRICS = Brésil, Russie, Inde, Chine, Afrique du Sud. Ce sont des pays émergents à forte croissance économique qui représentent une part croissante du PIB mondial.","type":"qcm","difficulte":"moyen"},{"id":"q_hg_05_03","enonce":"Le développement durable vise à :","options":["A) Stopper toute croissance économique","B) Répondre aux besoins présents sans compromettre les générations futures","C) Développer uniquement les pays pauvres","D) Protéger la nature au détriment de l'économie"],"bonne_reponse":1,"explication":"Définition Brundtland (1987) : le développement durable répond aux besoins du présent sans compromettre la capacité des générations futures à répondre aux leurs. 3 piliers : économique, social, environnemental.","type":"qcm","difficulte":"facile"}],"conseil_strategique":"Toujours illustrer avec des pays concrets. IDH France ≈ 0,9 (élevé), Niger ≈ 0,4 (faible)."},{"id":"hg_06","titre":"EMC — Démocratie, droits et citoyenneté","theme":"EMC","statut":"a_reviser","priorite":"moyenne","fiche":"Valeurs de la République : Liberté, Égalité, Fraternité + laïcité, démocratie. Droits de l'Homme : DDHC 1789, DUDH 1948. Institutions : Parlement (Assemblée + Sénat), Gouvernement, Justice. Citoyenneté : droit de vote à 18 ans, engagement associatif, service civique. Lutte contre les discriminations.","mots_cles":["démocratie","droits de l'homme","citoyenneté","laïcité","République","DUDH"],"quiz":[{"id":"q_hg_06_01","enonce":"La DUDH (Déclaration Universelle des Droits de l'Homme) a été adoptée en :","options":["A) 1789","B) 1945","C) 1948","D) 1950"],"bonne_reponse":2,"explication":"La DUDH est adoptée le 10 décembre 1948 par l'ONU, après les horreurs de la WWII. Elle proclame des droits fondamentaux universels (vie, liberté, éducation, etc.). Ne pas confondre avec la DDHC française de 1789.","type":"qcm","difficulte":"moyen"},{"id":"q_hg_06_02","enonce":"La laïcité en France signifie :","options":["A) L'interdiction de toute religion","B) La séparation de l'Église et de l'État, liberté de conscience","C) La religion catholique comme religion d'État","D) L'obligation d'être athée dans l'espace public"],"bonne_reponse":1,"explication":"La laïcité (loi 1905) établit la séparation de l'Église et de l'État. L'État est neutre vis-à-vis des religions. Elle garantit la liberté de croyance de chacun tout en protégeant l'espace public de toute influence religieuse.","type":"qcm","difficulte":"moyen"},{"id":"q_hg_06_03","enonce":"À quel âge peut-on voter aux élections en France ?","options":["A) 16 ans","B) 17 ans","C) 18 ans","D) 21 ans"],"bonne_reponse":2,"explication":"En France, le droit de vote est accordé à 18 ans depuis 1974 (abaissé de 21 ans). Il faut être inscrit sur les listes électorales. La carte électorale est automatiquement envoyée à 18 ans.","type":"qcm","difficulte":"facile"}],"conseil_strategique":"DDHC (1789, France) ≠ DUDH (1948, ONU). Laïcité = neutralité de l'État, pas interdiction."}]},{"id":"physique_chimie","label":"Physique-Chimie","emoji":"⚛️","couleur":"#E07B39","couleur_fond":"#FFF3E8","duree_epreuve":"30 min","coeff":1,"date_epreuve":"2026-06-29","tirage_2026":true,"confirmation_tirage":"Physique-Chimie ET SVT confirmées pour 2026 (tirage officiel MEN)","lien_eduscol":"https://eduscol.education.fr/1618/programmes-et-ressources-en-physique-chimie-voie-gt","chapitres":[{"id":"pc_01","titre":"Électricité — circuits, loi d'Ohm, puissance","theme":"Électricité","statut":"a_reviser","priorite":"haute","fiche":"Circuit série vs parallèle. Loi d'Ohm : U = R × I (U en Volts, R en Ohms, I en Ampères). Puissance électrique : P = U × I (en Watts). Énergie : E = P × t (en Joules ou kWh). Générateurs (pile, secteur) et récepteurs (lampe, moteur). Lois des nœuds et des mailles.","mots_cles":["circuit","tension","intensité","résistance","loi d'Ohm","puissance"],"quiz":[{"id":"q_pc_01_01","enonce":"Une résistance de 10 Ω est soumise à une tension de 5 V. Quelle est l'intensité du courant qui la traverse ?","options":["A) 50 A","B) 2 A","C) 0,5 A","D) 15 A"],"bonne_reponse":2,"explication":"Loi d'Ohm : U = R × I → I = U/R = 5/10 = 0,5 A. Mémo : U = RI (\"URI\"). Toujours vérifier les unités : V = Ω × A.","type":"qcm","difficulte":"facile"},{"id":"q_pc_01_02","enonce":"Un appareil électrique fonctionne sous 220 V et consomme 2 A. Quelle est sa puissance ?","options":["A) 110 W","B) 222 W","C) 440 W","D) 218 W"],"bonne_reponse":2,"explication":"P = U × I = 220 × 2 = 440 W. Un four typique consomme 2000 W, une ampoule LED environ 10 W. Savoir estimer des ordres de grandeur est important.","type":"qcm","difficulte":"facile"},{"id":"q_pc_01_03","enonce":"Dans un circuit en série avec deux lampes, si une lampe est retirée :","options":["A) L'autre lampe brille plus fort","B) L'autre lampe s'éteint aussi","C) L'autre lampe continue à fonctionner normalement","D) Le courant double dans l'autre lampe"],"bonne_reponse":1,"explication":"En série, les composants sont sur le même fil. Si un composant est retiré, le circuit est ouvert et le courant ne passe plus nulle part — toutes les lampes s'éteignent. Différent du circuit parallèle.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Formule triangle URI : U en haut, R et I en bas. Cacher la valeur cherchée donne la formule."},{"id":"pc_02","titre":"Chimie — atomes, molécules, réactions","theme":"Chimie","statut":"a_reviser","priorite":"haute","fiche":"Structure de l'atome : noyau (protons + neutrons) + électrons. Numéro atomique Z = nb protons. Tableau périodique : familles, périodes. Molécules : représentation de Lewis. Réactions chimiques : réactifs → produits, conservation de la masse (loi de Lavoisier), équilibrage d'équations. pH : acide (<7), neutre (=7), basique (>7).","mots_cles":["atome","molécule","réaction chimique","conservation masse","pH","tableau périodique"],"quiz":[{"id":"q_pc_02_01","enonce":"L'atome de carbone (C) possède 6 protons. Combien d'électrons possède-t-il à l'état neutre ?","options":["A) 3","B) 12","C) 6","D) 0"],"bonne_reponse":2,"explication":"Un atome neutre possède autant d'électrons que de protons. Carbone : Z = 6 → 6 protons → 6 électrons. Si Z = 6, la configuration électronique est (2,4).","type":"qcm","difficulte":"facile"},{"id":"q_pc_02_02","enonce":"La loi de conservation de la masse (Lavoisier) stipule que :","options":["A) La masse augmente toujours lors d'une réaction","B) La masse totale des réactifs égale celle des produits","C) Certains atomes disparaissent lors d'une réaction","D) La masse diminue lors d'une combustion"],"bonne_reponse":1,"explication":"\"Rien ne se perd, rien ne se crée, tout se transforme\" — Lavoisier. Les atomes se réarrangent mais leur nombre est conservé. La masse totale avant = masse totale après.","type":"qcm","difficulte":"moyen"},{"id":"q_pc_02_03","enonce":"Le jus de citron a un pH de 2. Il est :","options":["A) Neutre","B) Basique","C) Acide","D) Légèrement basique"],"bonne_reponse":2,"explication":"pH < 7 = acide. pH = 7 = neutre. pH > 7 = basique. Le jus de citron (pH≈2) est très acide. Le sang (pH≈7,4) est légèrement basique. L'eau pure (pH=7) est neutre.","type":"qcm","difficulte":"facile"}],"conseil_strategique":"Pour équilibrer une équation : ne jamais modifier les formules, seulement les coefficients devant."},{"id":"pc_03","titre":"Mécanique — forces, mouvement, vitesse","theme":"Mécanique","statut":"a_reviser","priorite":"haute","fiche":"Forces : poids (P = m × g, g ≈ 10 N/kg sur Terre), réaction normale, frottements, poussée d'Archimède. Principe d'inertie (Newton 1) : sans force, mouvement rectiligne uniforme. Vitesse : v = d/t (en m/s). Unités : 1 km/h = 1/3,6 m/s. Représenter une force par un vecteur (point d'application, direction, sens, norme).","mots_cles":["force","poids","mouvement","vitesse","Newton","inertie"],"quiz":[{"id":"q_pc_03_01","enonce":"Un objet de masse 5 kg est posé sur Terre (g = 10 N/kg). Quel est son poids ?","options":["A) 5 N","B) 0,5 N","C) 50 N","D) 500 N"],"bonne_reponse":2,"explication":"P = m × g = 5 × 10 = 50 N. Attention : la masse (kg) ≠ le poids (N = Newton). Sur la Lune (g≈1,6 N/kg), le même objet pèserait 8 N mais aurait toujours une masse de 5 kg.","type":"qcm","difficulte":"facile"},{"id":"q_pc_03_02","enonce":"Une voiture parcourt 120 km en 1h30. Quelle est sa vitesse moyenne en km/h ?","options":["A) 80 km/h","B) 90 km/h","C) 100 km/h","D) 60 km/h"],"bonne_reponse":0,"explication":"v = d/t = 120 km / 1,5 h = 80 km/h. Attention : 1h30 = 1,5 h (pas 1,3 h !). Toujours convertir les durées en heures décimales.","type":"qcm","difficulte":"moyen"},{"id":"q_pc_03_03","enonce":"Selon le principe d'inertie (1ère loi de Newton), un objet soumis à aucune force :","options":["A) S'arrête progressivement","B) Accélère indéfiniment","C) Reste immobile ou en mouvement rectiligne uniforme","D) Tombe vers le bas"],"bonne_reponse":2,"explication":"1ère loi de Newton (principe d'inertie) : si la somme des forces est nulle, l'objet est soit immobile, soit en mouvement rectiligne uniforme (vitesse constante). C'est la situation idéale sans frottements.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"MASSE (kg) ≠ POIDS (N). Masse = propriété de l'objet. Poids = dépend de g. Toujours les unités !"},{"id":"pc_04","titre":"Énergie — formes, transferts, ressources","theme":"Énergie","statut":"a_reviser","priorite":"moyenne","fiche":"Formes d'énergie : cinétique (mouvement), potentielle (hauteur), thermique (chaleur), chimique (aliments, carburant), électrique, rayonnante (lumière). Transferts : travail, chaleur, rayonnement. Sources d'énergie : renouvelables (solaire, éolien, hydraulique) vs fossiles (pétrole, gaz, charbon). Bilan énergétique.","mots_cles":["énergie","cinétique","thermique","renouvelable","fossile","transfert"],"quiz":[{"id":"q_pc_04_01","enonce":"Laquelle de ces sources d'énergie est renouvelable ?","options":["A) Le charbon","B) Le pétrole","C) Le gaz naturel","D) L'énergie solaire"],"bonne_reponse":3,"explication":"Les énergies renouvelables sont inépuisables à l'échelle humaine : solaire, éolien, hydraulique, géothermique, biomasse. Le charbon, pétrole et gaz sont des combustibles fossiles non renouvelables.","type":"qcm","difficulte":"facile"},{"id":"q_pc_04_02","enonce":"Une voiture en mouvement possède principalement de l'énergie :","options":["A) Chimique","B) Potentielle","C) Cinétique","D) Nucléaire"],"bonne_reponse":2,"explication":"L'énergie cinétique est l'énergie liée au mouvement : Ec = ½mv². Plus la voiture va vite et est lourde, plus son énergie cinétique est grande. C'est pourquoi les accidents à grande vitesse sont plus graves.","type":"qcm","difficulte":"facile"},{"id":"q_pc_04_03","enonce":"La conversion d'énergie dans une centrale thermique est :","options":["A) Électrique → chimique","B) Chimique → thermique → mécanique → électrique","C) Solaire → électrique","D) Mécanique → chimique"],"bonne_reponse":1,"explication":"Centrale thermique : combustion (énergie chimique) → chaleur (thermique) → vapeur qui tourne une turbine (mécanique) → alternateur (électrique). Chaque conversion entraîne des pertes (rendement < 100%).","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Identifier la chaîne de conversion : énergie initiale → pertes → énergie finale."}]},{"id":"svt","label":"SVT — Sciences de la Vie et de la Terre","emoji":"🧬","couleur":"#4CAF50","couleur_fond":"#EAF6EA","duree_epreuve":"30 min","coeff":1,"date_epreuve":"2026-06-29","tirage_2026":true,"confirmation_tirage":"SVT ET Physique-Chimie confirmées pour 2026 (tirage officiel MEN)","lien_eduscol":"https://eduscol.education.fr/1616/programmes-et-ressources-en-sciences-de-la-vie-et-de-la-terre-voie-gt","chapitres":[{"id":"svt_01","titre":"Génétique — ADN, chromosomes, hérédité","theme":"Génétique","statut":"a_reviser","priorite":"haute","fiche":"ADN = molécule support de l'information génétique. Gène = portion d'ADN. Allèles = formes différentes d'un gène. Chromosome : 46 chromosomes chez l'humain (23 paires), dont XX (femme) ou XY (homme). Méiose → gamètes (ovule/spermatozoïde). Dominance/récessivité. Mutations génétiques.","mots_cles":["ADN","gène","chromosome","allèle","méiose","hérédité","mutation"],"quiz":[{"id":"q_svt_01_01","enonce":"Combien de chromosomes possède une cellule humaine normale (somatique) ?","options":["A) 23","B) 46","C) 48","D) 92"],"bonne_reponse":1,"explication":"Les cellules humaines contiennent 46 chromosomes (23 paires). Les gamètes (ovule, spermatozoïde) sont haploïdes : 23 chromosomes. La fécondation reconstitue les 46 chromosomes.","type":"qcm","difficulte":"facile"},{"id":"q_svt_01_02","enonce":"Quels sont les chromosomes sexuels d'un homme ?","options":["A) XX","B) XY","C) YY","D) XO"],"bonne_reponse":1,"explication":"Les hommes ont les chromosomes sexuels XY. Les femmes ont XX. C'est le spermatozoïde qui détermine le sexe : s'il porte un X → fille (XX), s'il porte un Y → garçon (XY).","type":"qcm","difficulte":"facile"},{"id":"q_svt_01_03","enonce":"Un allèle récessif s'exprime :","options":["A) Toujours, quel que soit l'autre allèle","B) Uniquement en présence d'un allèle dominant","C) Seulement si les deux allèles sont récessifs","D) Jamais chez les humains"],"bonne_reponse":2,"explication":"Un allèle récessif ne s'exprime que si l'individu est homozygote récessif (aa). Si un allèle dominant (A) est présent, il masque le récessif (Aa → phénotype dominant). Exemple : groupe sanguin O est récessif.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Hiérarchie : ADN → gène → allèle → chromosome → cellule."},{"id":"svt_02","titre":"Système immunitaire — défenses, vaccins, antibiotiques","theme":"Santé","statut":"a_reviser","priorite":"haute","fiche":"Défenses non spécifiques : barrières physiques (peau), inflammation, phagocytose. Défenses spécifiques : lymphocytes B (anticorps) et T. Mémoire immunitaire → base de la vaccination. Vaccin = antigènes inactivés qui entraînent la mémoire sans la maladie. Antibiotiques : efficaces contre bactéries, INEFFICACES contre virus.","mots_cles":["système immunitaire","lymphocyte","anticorps","vaccination","phagocytose","antibiotique"],"quiz":[{"id":"q_svt_02_01","enonce":"Les anticorps sont produits par :","options":["A) Les lymphocytes T","B) Les lymphocytes B","C) Les phagocytes","D) Les globules rouges"],"bonne_reponse":1,"explication":"Les lymphocytes B (= plasmocytes quand activés) produisent les anticorps. Les lymphocytes T, eux, détruisent directement les cellules infectées (lymphocytes T cytotoxiques) ou coordonnent la réponse immunitaire (T auxiliaires).","type":"qcm","difficulte":"moyen"},{"id":"q_svt_02_02","enonce":"Un médecin prescrit des antibiotiques pour une grippe. Cette prescription est :","options":["A) Correcte, les antibiotiques tuent tous les microbes","B) Correcte si la grippe est grave","C) Incorrecte, les antibiotiques n'agissent pas sur les virus","D) Correcte, pour éviter les complications"],"bonne_reponse":2,"explication":"Les antibiotiques agissent sur les bactéries, pas sur les virus. La grippe est causée par un virus (influenza). Prescrire des antibiotiques contre un virus est inefficace et contribue à l'antibiorésistance.","type":"qcm","difficulte":"moyen"},{"id":"q_svt_02_03","enonce":"Le principe de la vaccination repose sur :","options":["A) Injecter directement des anticorps","B) La mémoire immunitaire développée par une première exposition","C) Renforcer les phagocytes","D) Bloquer la multiplication des virus"],"bonne_reponse":1,"explication":"La vaccination introduit des antigènes (virus/bactérie inactivé ou fragment) qui déclenchent une réponse immunitaire et créent une mémoire. En cas de vrai contact ultérieur, la réponse est rapide et efficace.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"PIÈGE : antibiotiques contre un VIRUS = FAUX et dangereux (antibiorésistance)."},{"id":"svt_03","titre":"Nutrition et digestion","theme":"Corps humain","statut":"a_reviser","priorite":"haute","fiche":"Nutriments : glucides (énergie rapide), lipides (réserves), protéines (construction), vitamines, minéraux, eau. Digestion : bouche (amylase) → estomac (pepsine) → intestin grêle (absorption) → gros intestin. Enzymes digestives. Circulation sanguine distribue les nutriments. Besoins énergétiques.","mots_cles":["nutriment","digestion","enzyme","absorption","glucide","protéine","lipide"],"quiz":[{"id":"q_svt_03_01","enonce":"Où se produit principalement l'absorption des nutriments ?","options":["A) Dans l'estomac","B) Dans le gros intestin","C) Dans l'intestin grêle","D) Dans la bouche"],"bonne_reponse":2,"explication":"L'intestin grêle est le lieu principal d'absorption des nutriments (glucides, lipides, protéines, vitamines). Sa surface est très grande grâce aux villosités intestinales (~200 m²). L'estomac dégrade surtout les protéines.","type":"qcm","difficulte":"moyen"},{"id":"q_svt_03_02","enonce":"Les glucides sont principalement utilisés par l'organisme pour :","options":["A) Construire les muscles","B) Fournir de l'énergie rapidement","C) Former les hormones","D) Constituer les membranes cellulaires"],"bonne_reponse":1,"explication":"Les glucides (sucres) sont la source d'énergie rapide préférentielle des cellules. Le glucose est dégradé lors de la respiration cellulaire pour produire de l'ATP. Les lipides constituent des réserves énergétiques à long terme.","type":"qcm","difficulte":"facile"},{"id":"q_svt_03_03","enonce":"Quelle enzyme commence à digérer l'amidon dès la bouche ?","options":["A) La pepsine","B) La lipase","C) L'amylase salivaire","D) La trypsine"],"bonne_reponse":2,"explication":"L'amylase salivaire (ptvaline) dégrade l'amidon en sucres simples dès la bouche. La pepsine agit sur les protéines dans l'estomac. La lipase dégrade les graisses. La trypsine est pancréatique.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Digestion = SIMPLIFICATION. Amidon→glucose. Protéines→acides aminés. Lipides→acides gras."},{"id":"svt_04","titre":"Écologie — biodiversité et écosystèmes","theme":"Écologie","statut":"a_reviser","priorite":"moyenne","fiche":"Écosystème = biocénose (êtres vivants) + biotope (milieu). Chaîne alimentaire : producteurs → consommateurs 1er ordre → consommateurs 2e ordre → décomposeurs. Réseaux trophiques. Biodiversité (spécifique, génétique, écosystémique). Perturbations : pollution, déforestation, changement climatique, espèces invasives.","mots_cles":["écosystème","chaîne alimentaire","biodiversité","biotope","biocénose","décomposeur"],"quiz":[{"id":"q_svt_04_01","enonce":"Dans une chaîne alimentaire, les producteurs sont :","options":["A) Les animaux herbivores","B) Les champignons décomposeurs","C) Les végétaux chlorophylliens","D) Les carnivores"],"bonne_reponse":2,"explication":"Les producteurs sont les végétaux (et algues) qui synthétisent de la matière organique grâce à la photosynthèse (lumière + CO₂ + eau → glucose + O₂). Ils constituent la base de toutes les chaînes alimentaires.","type":"qcm","difficulte":"facile"},{"id":"q_svt_04_02","enonce":"La biodiversité désigne :","options":["A) Le nombre total d'individus sur Terre","B) La variété du vivant à toutes ses échelles","C) Uniquement le nombre d'espèces animales","D) La diversité des paysages"],"bonne_reponse":1,"explication":"La biodiversité comprend 3 niveaux : diversité des espèces (spécifique), diversité génétique au sein d'une espèce, diversité des écosystèmes. Elle est essentielle à l'équilibre des écosystèmes.","type":"qcm","difficulte":"moyen"},{"id":"q_svt_04_03","enonce":"Le rôle des décomposeurs dans un écosystème est de :","options":["A) Produire de l'énergie solaire","B) Chasser les herbivores","C) Recycler la matière organique morte en matière minérale","D) Photosynthétiser"],"bonne_reponse":2,"explication":"Les décomposeurs (bactéries, champignons) dégradent la matière organique morte (feuilles, cadavres) en sels minéraux réutilisables par les plantes. Ils bouclent ainsi les cycles de la matière.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Flèche = 'est mangé par'. Producteurs TOUJOURS au début. Décomposeurs recyclent tout."},{"id":"svt_05","titre":"Reproduction et sexualité","theme":"Corps humain","statut":"a_reviser","priorite":"moyenne","fiche":"Puberté : transformations physiques et hormonales. Appareil reproducteur masculin (testicules, spermatozoïdes) et féminin (ovaires, ovules, cycle menstruel ~28j). Fécondation : fusion ovule + spermatozoïde → zygote. Grossesse : 9 mois, développement embryon/fœtus. Contraception : différentes méthodes, modes d'action.","mots_cles":["puberté","ovulation","fécondation","grossesse","contraception","hormones"],"quiz":[{"id":"q_svt_05_01","enonce":"La fécondation chez l'être humain a lieu :","options":["A) Dans l'utérus","B) Dans le vagin","C) Dans les trompes de Fallope","D) Dans les ovaires"],"bonne_reponse":2,"explication":"La fécondation (fusion ovule + spermatozoïde) se produit généralement dans les trompes de Fallope. L'œuf fécondé (zygote) migre ensuite vers l'utérus pour s'y implanter (nidation).","type":"qcm","difficulte":"moyen"},{"id":"q_svt_05_02","enonce":"La durée moyenne d'un cycle menstruel est de :","options":["A) 14 jours","B) 21 jours","C) 28 jours","D) 35 jours"],"bonne_reponse":2,"explication":"Le cycle menstruel dure en moyenne 28 jours (mais varie entre 21 et 35 jours selon les femmes). L'ovulation se produit généralement vers le 14e jour. Les règles durent 3 à 7 jours.","type":"qcm","difficulte":"facile"},{"id":"q_svt_05_03","enonce":"Le préservatif est le seul moyen de contraception qui :","options":["A) Empêche à 100% la grossesse","B) Protège aussi contre les IST","C) Est remboursé à 100% par la Sécu","D) N'a aucun effet secondaire"],"bonne_reponse":1,"explication":"Le préservatif est le seul contraceptif qui protège à la fois contre les grossesses non désirées ET contre les IST (Infections Sexuellement Transmissibles comme le VIH). Il est essentiel de combiner les méthodes.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Fécondation dans les TROMPES. Nidation dans l'UTÉRUS. Légender TOUS les schémas."},{"id":"svt_06","titre":"Géologie — tectonique des plaques et séismes","theme":"Géologie","statut":"a_reviser","priorite":"moyenne","fiche":"Structure de la Terre : croûte, manteau, noyau externe (liquide), noyau interne (solide). Plaques tectoniques (~12 grandes plaques). Mouvements : convergence (subduction, collision → montagnes), divergence (rifts, dorsales), coulissage. Séismes : foyer, épicentre, ondes sismiques, magnitude (Richter). Volcans.","mots_cles":["tectonique","plaque","séisme","volcan","subduction","dorsale","manteau"],"quiz":[{"id":"q_svt_06_01","enonce":"Où se situe le foyer d'un séisme ?","options":["A) À la surface terrestre","B) En profondeur, là où se produit la rupture","C) Au centre de la Terre","D) Dans les océans uniquement"],"bonne_reponse":1,"explication":"Le foyer (ou hypocentre) est le point de rupture en profondeur. L'épicentre est la projection du foyer à la surface terrestre, là où les secousses sont ressenties le plus fort.","type":"qcm","difficulte":"moyen"},{"id":"q_svt_06_02","enonce":"La subduction se produit quand :","options":["A) Deux plaques s'écartent l'une de l'autre","B) Une plaque plonge sous une autre","C) Deux plaques coulissent horizontalement","D) Une plaque se fracture en deux"],"bonne_reponse":1,"explication":"La subduction = une plaque océanique (plus dense) plonge sous une plaque continentale. Elle génère des séismes, des volcans et peut former des fosses océaniques. Exemples : Andes, Japon.","type":"qcm","difficulte":"moyen"},{"id":"q_svt_06_03","enonce":"Les dorsales océaniques sont des zones où les plaques :","options":["A) Se rapprochent","B) S'écartent et créent du plancher océanique","C) Entrent en collision","D) Plongent dans le manteau"],"bonne_reponse":1,"explication":"Les dorsales océaniques sont des chaînes de montagnes sous-marines où deux plaques s'écartent. Du magma remonte et forme du nouveau plancher océanique. Exemple : dorsale médio-atlantique.","type":"qcm","difficulte":"moyen"}],"conseil_strategique":"Foyer = profondeur. Épicentre = surface (le plus secoué)."}]}],"schema_localstorage":{"profil":{"prenom":"string","avatar":"string (emoji)","classe":"string","etablissement":"string","date_creation":"ISO date"},"progression":{"[chapitre_id]":{"statut":"a_reviser | en_cours | acquis","date_debut":"ISO date","date_maitrise":"ISO date | null","nb_revisions":"number"}},"sm2":{"[chapitre_id]":{"easiness":"number (2.5 défaut)","interval":"number (jours)","repetitions":"number","next_review":"ISO date","last_score":"number (0-5)"}},"quiz_history":{"[session_id]":{"date":"ISO date","matiere_id":"string","chapitre_id":"string","source":"local | claude_api | opentdb","score":"number","total":"number","erreurs":["question_id"]}},"profil_lacunes":{"[chapitre_id]":{"taux_erreur":"number (0-1)","questions_ratees":["string"],"derniere_maj":"ISO date"}},"streak":{"current":"number","best":"number","last_activity":"ISO date","history":["ISO date"]}},"prompts_ia":{"quiz_cours":"Tu es un professeur de 3e préparant le DNB 2026. Génère 5 questions QCM ORIGINALES sur le chapitre '{chapitre}' de la matière '{matiere}'. Programme BO officiel, niveau Troisième. Difficulté : {difficulte}/3. Format JSON strict : {\"questions\":[{\"enonce\":\"...\",\"options\":[\"A)...\",\"B)...\",\"C)...\",\"D)...\"],\"bonne_reponse\":0,\"explication\":\"...\"}]}. Jamais deux fois la même question.","automatismes_maths":"Tu es un professeur de maths 3e. Génère 10 questions d'AUTOMATISMES mathématiques style DNB 2026 (répondre en moins de 2 min sans calculatrice). Thèmes : fractions, pourcentages, conversions, calcul littéral simple, lecture graphique. Format JSON identique.","exercice_ouvert":"Tu es un professeur de 3e. Pose UNE question ouverte de type Brevet (développement rédigé, calcul avec justification, ou analyse de document) sur '{chapitre}'. Fournis ensuite les éléments de correction attendus. Format : {\"question\":\"...\",\"type\":\"calcul|redaction|analyse\",\"correction\":{\"points_attendus\":[\"...\"],\"exemple_reponse\":\"...\"}}","feedback_lacunes":"L'élève a répondu à ces questions de '{matiere}' - '{chapitre}'. Erreurs : {erreurs}. Identifie la lacune principale en 1 phrase et génère 3 questions ciblées sur ce point précis."},"programme_progression":{"description":"Plan de révision en 4 semaines avant le DNB 2026","principe":"Chaque semaine a un thème. Le moteur adaptatif ajuste la difficulté automatiquement selon tes résultats.","semaines":[{"numero":1,"label":"Semaine 1 — Fondamentaux & Automatismes","objectif":"Sécuriser les bases : calcul mental, fractions, pourcentages, géométrie de base","chapitres_prioritaires":["maths_auto","maths_02","fr_03","hg_01"],"conseil":"20 min par jour sur les automatismes maths SANS calculatrice. Ce sont 20 points quasi gratuits !","seuil_passage":0.7},{"numero":2,"label":"Semaine 2 — Algèbre, Géométrie & Langue","objectif":"Équations, Pythagore, Thalès, trigonométrie, grammaire française","chapitres_prioritaires":["maths_03","maths_04","fr_01","fr_02","hg_02"],"conseil":"Pour chaque formule géo : l'écrire, la dessiner, l'appliquer. Triade gagnante.","seuil_passage":0.7},{"numero":3,"label":"Semaine 3 — Sciences & Histoire-Géo","objectif":"Physique-chimie, SVT, histoire contemporaine, géographie France","chapitres_prioritaires":["pc_01","pc_02","svt_01","svt_02","hg_03","hg_04"],"conseil":"Sciences : 30 min seulement à l'examen. Priorité aux formules et définitions clés.","seuil_passage":0.7},{"numero":4,"label":"Semaine 4 — Révision finale & Simulation","objectif":"Revoir les lacunes identifiées, simuler des conditions d'examen","chapitres_prioritaires":["maths_05","maths_06","fr_04","hg_05","hg_06","svt_03","svt_04"],"conseil":"Mode Examen Blanc : chronomètre, sans aide. Reproduire les conditions réelles du brevet.","seuil_passage":0.8}],"jalons":{"j_minus_14":"Lancer la semaine 1 — automatismes sécurisés","j_minus_10":"Semaine 2 — vérifier chapitres rouges","j_minus_7":"Semaine 3 — sciences et histoire-géo","j_minus_3":"Semaine 4 — simulation brevet complet","j_minus_1":"Révision légère uniquement, repos et sommeil !"}}};

async function loadData(){
  // Données embarquées — zéro dépendance réseau
  S.data = DATA_EMBEDDED;
  // Tentative fetch pour mise à jour éventuelle (silencieuse)
  try{
    const r=await fetch('troisieme.json');
    if(r.ok){ const d=await r.json(); if(d&&d.matieres) S.data=d; }
  }catch{}
}

// ── INIT ─────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async ()=>{
  loadLS();
  await loadData();
  refreshBadge();
  refreshRing();
  goHome();

  // Fermer quiz
  $('quiz-close').addEventListener('click', fermerQuiz);
  $('quiz-close').addEventListener('touchstart', e=>{ e.preventDefault(); fermerQuiz(); }, {passive:false});

  // Bouton Continuer
  $('quiz-next').addEventListener('click', ()=>{
    S.quiz.idx++;
    if(S.quiz.idx<S.quiz.qs.length) afficherQuestion();
    else finSession();
  });

  // FAB Examen blanc
  $('fab-examen').addEventListener('click', lancerExamen);
  $('fab-examen').addEventListener('touchstart', e=>{ e.preventDefault(); lancerExamen(); }, {passive:false});

  // Thème
  $('btn-theme').addEventListener('click', ()=>{
    document.body.classList.toggle('dark-bg');
    $('btn-theme').textContent=document.body.classList.contains('dark-bg')?'☀️':'🌙';
  });

  // Swipe bas pour fermer le quiz
  let touchStartY=0;
  $('quiz-screen').addEventListener('touchstart',e=>{ touchStartY=e.touches[0].clientY; },{passive:true});
  $('quiz-screen').addEventListener('touchend',e=>{
    const dy=e.changedTouches[0].clientY-touchStartY;
    if(dy>80&&$('quiz-screen').scrollTop===0) fermerQuiz();
  },{passive:true});
});
</script>
