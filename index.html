// ── FONCTIONS LOGIQUES ET ROUTAGE ───────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1; i>0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

}

// ── GESTIONNAIRE ET MOTEUR DU QUIZ (SESSIONS DE 5 QUESTIONS) ──
function lancerQuiz(matId, chapId) {
  const mat = PROGRAMME_OFFICIEL.matieres[matId];
  const factory = FACTORIES[chapId];
  
  S.quiz.matId = matId;
  S.quiz.chapId = chapId;
  S.quiz.label = mat.titre;
  S.quiz.idx = 0;
  S.quiz.score = 0;
  S.quiz.qs = [];
  
  // Génération de 5 questions uniques sans doublons via l'algorithme procédural
  while(S.quiz.qs.length < 5) {
    const q = factory(S.progress[chapId] || 1);
    if(!S.quiz.qs.some(exist => exist.enonce === q.enonce)) {
      S.quiz.qs.push(q);
    }
  }
  
  $('quiz-subject').textContent = S.quiz.label;
  $('btn-fiche-quiz').style.display = 'block';
  $('quiz-screen').classList.add('open');
  afficherQuestion();
}

  S.quiz.score = 0;
  S.quiz.qs = [];
  
  const toutesFactories = Object.values(FACTORIES);
  while(S.quiz.qs.length < 5) {
    const fact = toutesFactories[Math.floor(Math.random() * toutesFactories.length)];
    const q = fact(2);
    if(!S.quiz.qs.some(exist => exist.enonce === q.enonce)) {
      S.quiz.qs.push(q);
    }
  }
  
  $('quiz-subject').textContent = S.quiz.label;
  $('btn-fiche-quiz').style.display = 'none';
  $('quiz-screen').classList.add('open');
  afficherQuestion();
}

function fermerQuiz() {
  $('quiz-screen').classList.remove('open');
  $('quiz-footer').classList.remove('open');
  goHome();
}

function afficherQuestion() {
  const q = S.quiz.qs[S.quiz.idx];
  $('quiz-counter').textContent = `${S.quiz.idx + 1} / 5`;
  $('quiz-bar').style.width = `${((S.quiz.idx) / 5) * 100}%`;
  $('quiz-footer').classList.remove('open');
  
  let html = `
    <div class="q-badges">
      <span class="badge-level" style="background:var(--accent)">Brevet Officiel 2026</span>
      <span class="badge-theme">${S.quiz.label}</span>
    </div>
    <div class="q-enonce">${q.enonce}</div>
    <button class="btn-hint" id="hint-trigger" onclick="$('hint-box-el').classList.toggle('open')">💡 Besoin d'un indice pour résoudre ?</button>
    <div class="hint-box" id="hint-box-el">${q.hint}</div>
  `;
  
  if(q.type === "qcm") {
    S.quiz.typeSaisie = "qcm";
    html += `<div class="options-grid">`;
    q.options.forEach((opt) => {
      html += `<button class="btn-option" onclick="verifierQCM(this, '${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
    });
    html += `</div>`;
  } else {
    S.quiz.typeSaisie = "open";
    html += `
      <div class="open-answer-wrap">
        <textarea class="textarea-answer" id="open-text" placeholder="Rédigez votre réponse structurée ici..."></textarea>
        <button class="btn-valider" onclick="verifierOpen()">Soumettre ma réponse pour analyse</button>
      </div>
    `;
  }
  
  html += `
    <div class="explanation-box" id="exp-box">
      <div class="exp-head">🎓 Correction & Analyse Métier</div>
      <div class="exp-text">${q.exp}</div>
    </div>
  `;
  
  $('quiz-body').innerHTML = html;
}

function verifierQCM(btnSelected, optText) {
  const q = S.quiz.qs[S.quiz.idx];
  const allBtns = document.querySelectorAll('.btn-option');
  allBtns.forEach(b => b.disabled = true);
  
  if(optText === q.bon) {
    btnSelected.classList.add('correct');
    vibrate(30);
    S.quiz.score++;
  } else {
    btnSelected.classList.add('wrong');
    vibrate([50, 50]);
    // Recherche et affichage de la bonne option pour transparence
    allBtns.forEach(b => {
      if(b.textContent === q.bon) b.classList.add('correct');
    });
    // Inscription au carnet d'erreurs
    if(!S.carnet.some(e => e.enonce === q.enonce)) {
      S.carnet.push(q);
      refreshBadge();
    }
  }
  
  $('exp-box').classList.add('open');
  $('quiz-bar').style.width = `${((S.quiz.idx + 1) / 5) * 100}%`;
  $('quiz-footer').classList.add('open');
}

function verifierOpen() {
  const q = S.quiz.qs[S.quiz.idx];
  const text = $('open-text').value.toLowerCase();
  
  if(!text.trim()) {
    alert("Veuillez saisir une réponse avant de valider.");
    return;
  }
  
  $('open-text').disabled = true;
  document.querySelector('.btn-valider').disabled = true;
  
  // Validation intelligente par recherche de mots-clés (MEN)
  const trouves = q.keywords.filter(kw => text.includes(kw));
  const scorePct = trouves.length / q.keywords.length;
  
  let feedbackHtml = `<div class="keywords-feedback">`;
  q.keywords.forEach(kw => {
    if(text.includes(kw)) {
      feedbackHtml += `<span class="kw-found">✓ ${kw}</span>`;
    } else {
      feedbackHtml += `<span class="kw-missing">✗ ${kw}</span>`;
    }
  });
  feedbackHtml += `</div>`;
  
  $('quiz-body').insertAdjacentHTML('beforeend', feedbackHtml);
  
  if(scorePct >= 0.5) {
    S.quiz.score++;
    vibrate(30);
  } else {
    vibrate([50, 50]);
    if(!S.carnet.some(e => e.enonce === q.enonce)) {
      S.carnet.push(q);
      refreshBadge();
    }
  }
  
  $('exp-box').classList.add('open');
  $('quiz-bar').style.width = `${((S.quiz.idx + 1) / 5) * 100}%`;
  $('quiz-footer').classList.add('open');
}

function finSession() {
  $('quiz-bar').style.width = '100%';
  let emoji = "🎖️"; let msg = "Excellent travail ! Vous ciblez la mention Très Bien.";
  if(S.quiz.score < 3) { emoji = "🫵"; msg = "Il faut relire attentivement la fiche de cours et recommencer."; }
  
  let html = `
    <div class="result-screen">
      <span class="result-emoji">${emoji}</span>
      <h2>Session terminée !</h2>
      <div class="result-score">${S.quiz.score} / 5</div>
      <p class="result-msg">${msg}</p>
      <div class="result-bar-wrap">
        <div class="result-bar-fill" style="width:${(S.quiz.score/5)*100}%; background:var(--accent-grad)"></div>
      </div>
      <div class="result-btns">
        <button class="btn-primary" onclick="fermerQuiz()">Fermer et voir ma progression</button>
      </div>
    </div>
  `;
  
  // Enregistrement de l'expérience et montée en niveau
  if(S.quiz.score >= 4 && S.quiz.chapId) {
    const actuel = S.progress[S.quiz.chapId] || 0;
    if(actuel < 3) S.progress[S.quiz.chapId] = actuel + 1;
  }
  
  S.streakToday++;
  saveLS();
  $('quiz-body').innerHTML = html;
}

// ── INITIALISATION NATIVE DE L'APPLICATION ───────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadLS();
  refreshBadge();
  goHome();
  
  // Fermeture forcée de la modale
  $('quiz-close').addEventListener('click', fermerQuiz);
  
  // Gestionnaire d'incrémentation du bouton continuer
  $('quiz-next').addEventListener('click', () => {
    S.quiz.idx++;
    if(S.quiz.idx < S.quiz.qs.length) {
      afficherQuestion();
    } else {
      finSession();
    }
  });
  
  // Gestion alternative Thème
  $('btn-theme').addEventListener('click', () => {
    document.body.classList.toggle('dark-bg');
    if(document.body.classList.contains('dark-bg')) {
      document.body.style.setProperty('--bg', '#1E1B24');
      document.body.style.setProperty('--text', '#F4F1FA');
      $('btn-theme').textContent = '☀️';
    } else {
      document.body.style.setProperty('--bg', '#F4F1FA');
      document.body.style.setProperty('--text', '#332F3A');
      $('btn-theme').textContent = '🌙';
    }
  });
  
  // Trigger bouton FAB Examen Blanc
  $('fab-examen').addEventListener('click', lancerExamen);
});
</script>
